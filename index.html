<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta CNPJ</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c2430; --muted:#5f6b7a; --accent:#1f6feb; --ok:#1a7f37; --bad:#cf222e; --border:#d8dee4; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:48px auto; padding:0 16px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; font-size:1rem; border:1px solid var(--border); border-radius:8px; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { padding:12px 20px; font-size:1rem; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; margin-top:20px; }
  .status { display:inline-block; padding:6px 12px; border-radius:999px; font-weight:600; color:#fff; }
  .ativa { background:var(--ok); } .outra { background:var(--bad); }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:8px 16px; margin:16px 0 0; }
  dt { color:var(--muted); } dd { margin:0; font-weight:500; }
  .erro { color:var(--bad); }
  .fonte { color:var(--muted); font-size:.85rem; margin:16px 0 0; }
  .fonte a { color:var(--accent); }
  footer { color:var(--muted); font-size:.8rem; margin-top:24px; }
</style>
</head>
<body>
<main>
  <h1>Consulta CNPJ</h1>
  <p class="sub">Digite o CNPJ para ver a situação cadastral na Receita Federal.</p>

  <form id="form">
    <input id="cnpj" inputmode="numeric" placeholder="00.000.000/0000-00" maxlength="18" autocomplete="off" required>
    <button id="btn" type="submit">Consultar</button>
  </form>

  <div id="resultado"></div>

  <footer>Dados públicos da Receita Federal (BrasilAPI, Minha Receita, CNPJá, CNPJ.ws, ReceitaWS). Podem ter alguns dias de atraso em relação à Receita.</footer>
</main>

<script>
const input = document.getElementById('cnpj');
const btn = document.getElementById('btn');
const out = document.getElementById('resultado');

input.addEventListener('input', () => {
  const d = input.value.replace(/\D/g, '').slice(0, 14);
  input.value = d
    .replace(/^(\d{2})(\d)/, '$1.$2')
    .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
    .replace(/\.(\d{3})(\d)/, '.$1/$2')
    .replace(/(\d{4})(\d)/, '$1-$2');
});

function cnpjValido(c) {
  if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
  const calc = (base) => {
    const pesos = base.length === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2];
    const r = base.split('').reduce((a, n, i) => a + n * pesos[i], 0) % 11;
    return r < 2 ? 0 : 11 - r;
  };
  const d1 = calc(c.slice(0, 12));
  return c.endsWith('' + d1 + calc(c.slice(0, 12) + d1));
}

const esc = (s) => String(s ?? '—').replace(/[&<>"]/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
// aceita "2005-11-03", "2005-11-03T..." ou "03/11/2005"
const data = (s) => !s ? '—' : /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10).split('-').reverse().join('/') : s;

class NaoEncontrado extends Error {}

async function getJSON(url) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 10000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (res.status === 404) throw new NaoEncontrado();
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}

// ReceitaWS não libera CORS, então usa JSONP
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = 'cb' + Date.now() + Math.floor(Math.random() * 1e6);
    const sc = document.createElement('script');
    const fim = () => { delete window[cb]; sc.remove(); clearTimeout(t); };
    const t = setTimeout(() => { fim(); reject(new Error('timeout')); }, 10000);
    window[cb] = (d) => { fim(); resolve(d); };
    sc.onerror = () => { fim(); reject(new Error('erro')); };
    sc.src = url + '?callback=' + cb;
    document.head.appendChild(sc);
  });
}

// Cada fonte devolve o mesmo formato
const FONTES = [
  { nome: 'BrasilAPI', buscar: async (c) => {
    const j = await getJSON('https://brasilapi.com.br/api/cnpj/v1/' + c);
    return { situacao: j.descricao_situacao_cadastral, razao: j.razao_social, fantasia: j.nome_fantasia,
      dataSit: j.data_situacao_cadastral, motivo: j.descricao_motivo_situacao_cadastral,
      abertura: j.data_inicio_atividade, municipio: j.municipio, uf: j.uf };
  }},
  { nome: 'Minha Receita', buscar: async (c) => {
    const j = await getJSON('https://minhareceita.org/' + c);
    return { situacao: j.descricao_situacao_cadastral, razao: j.razao_social, fantasia: j.nome_fantasia,
      dataSit: j.data_situacao_cadastral, motivo: j.descricao_motivo_situacao_cadastral,
      abertura: j.data_inicio_atividade, municipio: j.municipio, uf: j.uf };
  }},
  { nome: 'CNPJá', buscar: async (c) => {
    const j = await getJSON('https://open.cnpja.com/office/' + c);
    return { situacao: j.status?.text, razao: j.company?.name, fantasia: j.alias,
      dataSit: j.statusDate, motivo: j.reason?.text, abertura: j.founded,
      municipio: j.address?.city, uf: j.address?.state, atualizado: j.updated };
  }},
  { nome: 'CNPJ.ws', buscar: async (c) => {
    const j = await getJSON('https://publica.cnpj.ws/cnpj/' + c);
    const e = j.estabelecimento || {};
    return { situacao: e.situacao_cadastral, razao: j.razao_social, fantasia: e.nome_fantasia,
      dataSit: e.data_situacao_cadastral, motivo: e.motivo_situacao_cadastral?.descricao,
      abertura: e.data_inicio_atividade, municipio: e.cidade?.nome, uf: e.estado?.sigla, atualizado: j.atualizado_em };
  }},
  { nome: 'ReceitaWS', buscar: async (c) => {
    const j = await jsonp('https://receitaws.com.br/v1/cnpj/' + c);
    if (j.status === 'ERROR') {
      if (/inv[aá]lido|n[aã]o encontrado/i.test(j.message || '')) throw new NaoEncontrado();
      throw new Error(j.message);
    }
    return { situacao: j.situacao, razao: j.nome, fantasia: j.fantasia, dataSit: j.data_situacao,
      motivo: j.motivo_situacao, abertura: j.abertura, municipio: j.municipio, uf: j.uf, atualizado: j.ultima_atualizacao };
  }},
];

async function consultar(cnpj) {
  let naoEncontrado = 0;
  for (const f of FONTES) {
    try {
      const r = await f.buscar(cnpj);
      if (!r.situacao || !r.razao) throw new Error('resposta incompleta');
      return { ...r, fonte: f.nome };
    } catch (e) {
      if (e instanceof NaoEncontrado) naoEncontrado++;
    }
  }
  throw new Error(naoEncontrado
    ? 'CNPJ não encontrado na base da Receita.'
    : 'Todas as fontes estão indisponíveis no momento. Tente novamente em instantes.');
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const cnpj = input.value.replace(/\D/g, '');
  if (!cnpjValido(cnpj)) {
    out.innerHTML = '<div class="card erro">CNPJ inválido. Confira os números.</div>';
    return;
  }
  btn.disabled = true; btn.textContent = 'Consultando...';
  out.innerHTML = '';
  try {
    const j = await consultar(cnpj);
    const sit = String(j.situacao).toUpperCase();
    const motivo = j.motivo && !/^sem motivo$/i.test(j.motivo) ? j.motivo : '';
    out.innerHTML = `
      <div class="card">
        <span class="status ${sit === 'ATIVA' ? 'ativa' : 'outra'}">${esc(sit)}</span>
        <dl>
          <dt>Razão social</dt><dd>${esc(j.razao)}</dd>
          <dt>Nome fantasia</dt><dd>${esc(j.fantasia || '—')}</dd>
          <dt>CNPJ</dt><dd>${esc(input.value)}</dd>
          <dt>Data da situação</dt><dd>${data(j.dataSit)}</dd>
          ${motivo ? `<dt>Motivo</dt><dd>${esc(motivo)}</dd>` : ''}
          <dt>Abertura</dt><dd>${data(j.abertura)}</dd>
          <dt>Município/UF</dt><dd>${esc(j.municipio)} / ${esc(j.uf)}</dd>
        </dl>
        <p class="fonte">Fonte: ${esc(j.fonte)}${j.atualizado ? ' · base atualizada em ' + data(j.atualizado) : ''}
          · <a href="https://solucoes.receita.fazenda.gov.br/Servicos/cnpjreva/cnpjreva_solicitacao.asp" target="_blank" rel="noopener">conferir na Receita</a></p>
      </div>`;
  } catch (err) {
    out.innerHTML = `<div class="card erro">${esc(err.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Consultar';
  }
});
</script>
</body>
</html>
